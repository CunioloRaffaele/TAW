server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Fondamentale per Angular: se il percorso non esiste, vai su index.html
        try_files $uri $uri/ /index.html;
    }

    # Reindirizza gli errori del server alla pagina index
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
